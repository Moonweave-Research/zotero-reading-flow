<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">
  <groupbox>
    <label><html:h2>Reading Flow</html:h2></label>
    <html:div style="display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: center; max-width: 420px;">
      <html:label for="readingflow-pref-color-completed">Completed color</html:label>
      <html:input id="readingflow-pref-color-completed" type="color" preference="extensions.readingflow.color-completed"/>
      <html:label for="readingflow-pref-color-reading">Reading color</html:label>
      <html:input id="readingflow-pref-color-reading" type="color" preference="extensions.readingflow.color-reading"/>
      <html:label for="readingflow-pref-debug">Debug logging</html:label>
      <html:input id="readingflow-pref-debug" type="checkbox" preference="extensions.readingflow.debug"/>
      <html:label for="readingflow-pref-density">Reading Flow column density</html:label>
      <html:select id="readingflow-pref-density" preference="extensions.readingflow.displayDensity" onchange="Zotero.ReadingFlowColumnManager?.setDisplayDensity(this.value)">
        <html:option value="compact">Compact</html:option>
        <html:option value="icons">Icons</html:option>
      </html:select>
    </html:div>
    <description><html:span id="readingflow-pref-density-message" data-l10n-id="reading-flow-density-help">This changes only the contents of the Reading Flow column. Use Zotero's native column chooser to show or hide it.</html:span></description>
  </groupbox>
</vbox>
