<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-labelledby="title desc">
  <title id="title">To Read to Reading icon key</title>
  <desc id="desc">The combined Reading Flow column uses an orange closed book for To Read and an open book for Reading. This is an explanatory legend, not a Zotero screenshot.</desc>
  <rect width="480" height="150" rx="8" fill="#ffffff"/>
  <g text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="56">
    <text x="110" y="76">📙</text>
    <text x="370" y="76">📖</text>
  </g>
  <path d="M211 56h56m-11-11 11 11-11 11" fill="none" stroke="#57606a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#1f2328">
    <text x="110" y="120">To Read</text>
    <text x="370" y="120">Reading</text>
  </g>
</svg>
